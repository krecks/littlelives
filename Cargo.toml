[workspace]
resolver = "3"
members = ["crates/sim-core", "crates/sim-wasm"]

[workspace.package]
edition = "2024"
version = "0.5.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
