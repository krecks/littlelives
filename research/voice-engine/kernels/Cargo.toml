[package]
name = "voice-kernels"
edition = "2024"
version = "0.0.0"
publish = false

# Throwaway micro-benchmark of the dominant Paradee kernels (docs/design/voices.md, phase 5).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "native"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
